name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test for ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Linux
            platform: linux
          - os: windows-2025
            os-name: Windows
            platform: windows
          - os: macos-latest
            os-name: macOS (arm64)
            platform: macos
            arch: arm64
          - os: macos-latest
            os-name: macOS (x86_64)
            platform: macos
            arch: x86_64
          - os: ubuntu-latest
            os-name: Android (arm64)
            platform: android
            arch: arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install SCons
      run: pip install scons

    - name: Install Linux dependencies
      if: matrix.platform == 'linux'
      run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxfixes-dev libxinerama-dev libwayland-dev libpipewire-0.3-dev libsystemd-dev

    - name: Set up Android NDK
      if: matrix.platform == 'android'
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27d

    - name: Export NDK path
      if: matrix.platform == 'android'
      run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

    - name: Install Android SDK build dependencies
      if: matrix.platform == 'android'
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          godot-cpp
          livekit-sdk
        key: deps-${{ matrix.platform }}-${{ matrix.arch || matrix.platform }}-${{ hashFiles('build.sh', 'patches/**') }}

    - name: Build GDExtension
      shell: bash
      run: ./build.sh ${{ matrix.platform }} ${{ matrix.arch || '' }}

    - name: Download Godot 4 Headless
      if: matrix.platform != 'windows' && matrix.platform != 'android'
      run: |
        if [ "${{ matrix.platform }}" == "linux" ]; then
          wget https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip Godot_v4.5-stable_linux.x86_64.zip
          mv Godot_v4.5-stable_linux.x86_64 godot
        elif [ "${{ matrix.platform }}" == "macos" ]; then
          wget https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_macos.universal.zip
          unzip Godot_v4.5-stable_macos.universal.zip
          xattr -cr Godot.app
          codesign --force --deep --sign - Godot.app
          mv Godot.app/Contents/MacOS/Godot godot
        fi
        chmod +x godot

    - name: Install coreutils for timeout (macOS)
      if: matrix.platform == 'macos'
      run: brew install coreutils

    - name: Install GUT
      if: matrix.platform != 'windows' && matrix.platform != 'android'
      run: |
        git clone --depth 1 --branch v9.3.0 https://github.com/bitwes/Gut.git /tmp/gut
        mkdir -p addons
        cp -r /tmp/gut/addons/gut addons/gut
        rm -rf /tmp/gut

    - name: Run tests
      if: matrix.platform != 'windows' && matrix.platform != 'android'
      run: ./test.sh

    - name: Upload test results
      if: matrix.platform != 'windows' && matrix.platform != 'android' && always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os-name }}-${{ matrix.arch || matrix.platform }}
        path: test_results.xml
        if-no-files-found: ignore

  web:
    name: Build and Test for Web
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5"
      # Godot's web templates require extensions built with a matching Emscripten.
      EMSCRIPTEN_VERSION: "4.0.11"
      LIVEKIT_SERVER_VERSION: "1.13.7"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install SCons
      run: pip install scons

    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: ${{ env.EMSCRIPTEN_VERSION }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        # SConstruct.web builds godot-cpp through its SConscript, so SCons's signatures (in the
        # root .sconsign.dblite) are what let it reuse the cached objects instead of rebuilding.
        path: |
          godot-cpp
          .sconsign.dblite
        key: deps-web-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('build.sh', 'SConstruct.web') }}

    - name: Build GDExtension
      run: ./build.sh web

    - name: Cache Godot and export templates
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: |
          godot
          ~/.local/share/godot/export_templates
        key: godot-${{ env.GODOT_VERSION }}-web-templates

    - name: Download Godot and web export templates
      if: steps.cache-godot.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
        chmod +x godot
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
        templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
        mkdir -p "$templates"
        unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/web_*' 'templates/version.txt' -d "$templates"

    - name: Install GUT
      run: |
        git clone --depth 1 --branch v9.5.0 https://github.com/bitwes/Gut.git /tmp/gut
        mkdir -p addons
        cp -r /tmp/gut/addons/gut addons/gut

    - name: Start LiveKit server
      run: |
        wget -q https://github.com/livekit/livekit/releases/download/v${LIVEKIT_SERVER_VERSION}/livekit_${LIVEKIT_SERVER_VERSION}_linux_amd64.tar.gz
        tar -xzf livekit_${LIVEKIT_SERVER_VERSION}_linux_amd64.tar.gz livekit-server
        ./livekit-server --dev --bind 127.0.0.1 > livekit-server.log 2>&1 &

    - name: Run tests
      run: |
        export LIVEKIT_TEST_URL=ws://127.0.0.1:7880
        export LIVEKIT_TOKEN_1=$(python3 test/dev_token.py web-user-1 web-integration)
        export LIVEKIT_TOKEN_2=$(python3 test/dev_token.py web-user-2 web-integration)
        export RUN_E2E=1
        export LIVEKIT_E2E_URL=ws://127.0.0.1:7880
        ./test_web.sh

  android:
    name: Test on Android (x86_64 emulator)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5.2"
      LIVEKIT_SERVER_VERSION: "1.13.7"
      # The emulator reaches the host's localhost at 10.0.2.2.
      LIVEKIT_TEST_URL: ws://10.0.2.2:7880
      LIVEKIT_E2E_URL: ws://10.0.2.2:7880
      RUN_E2E: "1"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install SCons
      run: pip install scons

    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27d

    - name: Export NDK path
      run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

    - name: Install Android SDK build dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          godot-cpp
          livekit-sdk
        key: deps-android-x86_64-${{ hashFiles('build.sh', 'patches/**') }}

    # x86_64, since GitHub's runners can only emulate their own architecture at a usable speed.
    - name: Build GDExtension
      run: ./build.sh android x86_64

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Cache Godot and export templates
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: |
          godot
          ~/.local/share/godot/export_templates
        key: godot-${{ env.GODOT_VERSION }}-android-templates

    - name: Download Godot and Android export templates
      if: steps.cache-godot.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
        chmod +x godot
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
        templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
        mkdir -p "$templates"
        unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/android_*' 'templates/version.txt' -d "$templates"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-godot-${{ env.GODOT_VERSION }}

    - name: Install GUT
      run: |
        git clone --depth 1 --branch v9.5.0 https://github.com/bitwes/Gut.git /tmp/gut
        mkdir -p addons
        cp -r /tmp/gut/addons/gut addons/gut

    - name: Start LiveKit server
      run: |
        wget -q https://github.com/livekit/livekit/releases/download/v${LIVEKIT_SERVER_VERSION}/livekit_${LIVEKIT_SERVER_VERSION}_linux_amd64.tar.gz
        tar -xzf livekit_${LIVEKIT_SERVER_VERSION}_linux_amd64.tar.gz livekit-server
        ./livekit-server --dev > livekit-server.log 2>&1 &

    - name: Create join tokens
      run: |
        echo "LIVEKIT_TOKEN_1=$(python3 test/dev_token.py android-user-1 android-integration)" >> "$GITHUB_ENV"
        echo "LIVEKIT_TOKEN_2=$(python3 test/dev_token.py android-user-2 android-integration)" >> "$GITHUB_ENV"

    # Before starting the emulator, since both need a lot of CPU.
    - name: Export test app
      run: ./test_android.sh --export-only build/android-tests.apk --arch x86_64

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        cores: 4
        ram-size: 4096M
        # The action's defaults, but with audio, which the tests play.
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
        disable-animations: true
        script: ./test_android.sh --apk build/android-tests.apk

  ios:
    name: Test on iOS (arm64 simulator)
    runs-on: macos-latest
    env:
      GODOT_VERSION: "4.5.2"
      LIVEKIT_SERVER_VERSION: "1.13.7"
      # The simulator shares the host's network.
      LIVEKIT_TEST_URL: ws://127.0.0.1:7880
      LIVEKIT_E2E_URL: ws://127.0.0.1:7880
      RUN_E2E: "1"

    # Caches are restored and saved in separate steps, so that a failing test doesn't throw away a
    # long build.
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install build tools
      run: |
        pip install scons
        brew install ninja coreutils

    - name: Restore dependencies
      id: cache-deps
      uses: actions/cache/restore@v4
      with:
        path: |
          godot-cpp
          livekit-sdk
          livekit-sdk-ios-*
        key: deps-ios-${{ hashFiles('build.sh', 'patches/**') }}

    # The iOS export runs in the macOS editor, which loads the extension's macOS library.
    - name: Build GDExtension
      run: |
        ./build.sh ios
        ./build.sh ios --simulator
        ./build.sh macos arm64

    - name: Save dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          godot-cpp
          livekit-sdk
          livekit-sdk-ios-*
        key: ${{ steps.cache-deps.outputs.cache-primary-key }}

    - name: Restore Godot and iOS export templates
      id: cache-godot
      uses: actions/cache/restore@v4
      with:
        path: |
          Godot.app
          ~/Library/Application Support/Godot/export_templates
        key: godot-${{ env.GODOT_VERSION }}-macos-ios-templates

    - name: Download Godot and iOS export templates
      if: steps.cache-godot.outputs.cache-hit != 'true'
      run: |
        curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
        unzip -q godot.zip
        curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
        templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
        mkdir -p "$templates"
        unzip -q -j templates.tpz 'templates/ios.zip' 'templates/version.txt' -d "$templates"
        rm godot.zip templates.tpz

    - name: Save Godot and iOS export templates
      if: steps.cache-godot.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          Godot.app
          ~/Library/Application Support/Godot/export_templates
        key: ${{ steps.cache-godot.outputs.cache-primary-key }}

    # Godot's official templates have only x86_64 code in their simulator slice
    # (godotengine/godot#122379), and LiveKit's WebRTC has only an arm64 simulator build.
    - name: Restore Godot's arm64 simulator library
      id: cache-godot-simulator
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/godot-ios-simulator
        key: godot-${{ env.GODOT_VERSION }}-ios-template_debug-arm64-simulator

    - name: Build Godot's arm64 simulator library
      if: steps.cache-godot-simulator.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch ${GODOT_VERSION}-stable https://github.com/godotengine/godot.git "$RUNNER_TEMP/godot"
        cd "$RUNNER_TEMP/godot"
        scons platform=ios target=template_debug arch=arm64 ios_simulator=yes -j$(sysctl -n hw.ncpu)
        mkdir -p "$RUNNER_TEMP/godot-ios-simulator"
        cp bin/libgodot.ios.template_debug.arm64.simulator.a "$RUNNER_TEMP/godot-ios-simulator/libgodot.a"

    - name: Save Godot's arm64 simulator library
      if: steps.cache-godot-simulator.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/godot-ios-simulator
        key: ${{ steps.cache-godot-simulator.outputs.cache-primary-key }}

    - name: Install GUT
      run: |
        git clone --depth 1 --branch v9.5.0 https://github.com/bitwes/Gut.git /tmp/gut
        mkdir -p addons
        cp -r /tmp/gut/addons/gut addons/gut

    - name: Restore the LiveKit server
      id: cache-server
      uses: actions/cache/restore@v4
      with:
        path: livekit-server
        key: livekit-server-${{ env.LIVEKIT_SERVER_VERSION }}-macos-arm64

    # LiveKit's releases have no macOS binaries, and its go.mod's replace directives rule out
    # `go install`.
    - name: Fetch the LiveKit server source
      if: steps.cache-server.outputs.cache-hit != 'true'
      run: git clone --depth 1 --branch v${LIVEKIT_SERVER_VERSION} https://github.com/livekit/livekit.git "$RUNNER_TEMP/livekit"

    - name: Set up Go
      if: steps.cache-server.outputs.cache-hit != 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ runner.temp }}/livekit/go.mod
        cache: false

    - name: Build the LiveKit server
      if: steps.cache-server.outputs.cache-hit != 'true'
      working-directory: ${{ runner.temp }}/livekit
      run: go build -o "$GITHUB_WORKSPACE/livekit-server" ./cmd/server

    - name: Save the LiveKit server
      if: steps.cache-server.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: livekit-server
        key: ${{ steps.cache-server.outputs.cache-primary-key }}

    - name: Check that an export builds for iOS devices
      env:
        GODOT: ${{ github.workspace }}/Godot.app/Contents/MacOS/Godot
      run: ./test_ios.sh --build-for-device

    - name: Start LiveKit server
      run: |
        ./livekit-server --dev > livekit-server.log 2>&1 &
        for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:7880 && exit 0; sleep 1; done
        cat livekit-server.log
        exit 1

    - name: Create join tokens
      run: |
        echo "LIVEKIT_TOKEN_1=$(python3 test/dev_token.py ios-user-1 ios-integration)" >> "$GITHUB_ENV"
        echo "LIVEKIT_TOKEN_2=$(python3 test/dev_token.py ios-user-2 ios-integration)" >> "$GITHUB_ENV"

    - name: Run tests
      env:
        GODOT: ${{ github.workspace }}/Godot.app/Contents/MacOS/Godot
        GODOT_IOS_SIMULATOR_LIB: ${{ runner.temp }}/godot-ios-simulator/libgodot.a
      run: ./test_ios.sh

    - name: Upload the LiveKit server log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: livekit-server-log-ios
        path: livekit-server.log
        if-no-files-found: ignore
